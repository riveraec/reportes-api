[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reportes-api"
version = "0.1.0"
description = "API FastAPI sobre etl-reportes (runs, resumen, health)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Efrain Rivera" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = [".venv", "*.egg-info", ".git"]
addopts = "-q"